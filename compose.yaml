name: moratorium

services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-moratorium}
      POSTGRES_USER: ${POSTGRES_USER:-moratorium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-moratorium}:${POSTGRES_PASSWORD:-change_this_local_password}@database:5432/${POSTGRES_DB:-moratorium}?sslmode=disable
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && exec npm start"]
    expose:
      - "3000"
    networks:
      - app
      - database
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
  database:
    internal: true

volumes:
  postgres_data:

